name: Validate Access Request

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  validate-access:
    if: github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 01 Parse Request Data
        id: meta
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const requester = issue && issue.user && issue.user.login ? issue.user.login.trim() : '';
            const expectedTitle = requester ? `Access request for ${requester}` : 'Access request';

            const currentLabels = new Set((issue.labels || []).map((label) => label.name));
            const addIfMissing = async (name) => {
              if (currentLabels.has(name)) {
                return;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [name],
              });
              currentLabels.add(name);
            };

            await addIfMissing('access-request');

            if ((issue.title || '').trim() !== expectedTitle) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                headers: {
                  'X-GitHub-Api-Version': '2026-03-10',
                },
                title: expectedTitle,
              });
            }

            const hasValidatedLabel = currentLabels.has('validated');
            core.setOutput('has_validated_label', hasValidatedLabel ? 'true' : 'false');

      - name: 02 Set Label Processing
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;

            const removeIfPresent = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            await removeIfPresent('failed');
            await removeIfPresent('processed');
            await removeIfPresent('pending');

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['processing'],
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

      - name: 03 Validate Request Data
        id: codecheck
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COURSE_AUTOMATION_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            const normalizeCode = (value) =>
              String(value || '')
                .normalize('NFKC')
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();

            const lines = body.split(/\r?\n/);
            let accessCode = '';

            for (let index = 0; index < lines.length; index++) {
              const line = lines[index].trim();
              if (/^#{1,6}\s*access code\b/i.test(line)) {
                for (let inner = index + 1; inner < lines.length; inner++) {
                  const candidate = lines[inner].trim();
                  if (candidate === '' || candidate.startsWith('<!--')) {
                    continue;
                  }
                  if (/^#{1,6}\s/.test(candidate)) {
                    break;
                  }
                  accessCode = candidate;
                  break;
                }
                break;
              }
            }

            const response = await github.rest.repos.getContent({
              owner: 'zuyd-courses',
              repo: 'student-registry',
              path: 'config/access-codes.json',
            });

            const payload = Array.isArray(response.data) ? response.data[0] : response.data;
            const content = Buffer.from(payload.content, payload.encoding).toString('utf8');
            const parsed = JSON.parse(content);
            const accessCodes = parsed.course_access_codes || {};

            const normalizedInput = normalizeCode(accessCode);
            const validCodes = Object.values(accessCodes).map((value) => normalizeCode(value));
            const valid = Boolean(normalizedInput) && validCodes.includes(normalizedInput);
            core.setOutput('valid', valid ? 'true' : 'false');

      - name: 04 Redact Sensitive Data
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const lines = body.split(/\r?\n/);
            let accessCode = '';

            for (let index = 0; index < lines.length; index++) {
              const line = lines[index].trim();
              if (/^#{1,6}\s*access code\b/i.test(line)) {
                for (let inner = index + 1; inner < lines.length; inner++) {
                  const candidate = lines[inner].trim();
                  if (candidate === '' || candidate.startsWith('<!--')) {
                    continue;
                  }
                  if (/^#{1,6}\s/.test(candidate)) {
                    break;
                  }
                  accessCode = candidate;
                  break;
                }
                break;
              }
            }

            const redactedBody = accessCode ? body.replaceAll(accessCode, 'REDACTED') : body;
            if (redactedBody === body) {
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },
              body: redactedBody,
            });

      - name: 05 Handle Invalid Request
        if: steps.codecheck.outputs.valid != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'processing',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'pending',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['failed'],
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: 'Access code is not valid. The issue is closed. Submit a new access request issue with the correct access code to retry.',
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              headers: {
                'X-GitHub-Api-Version': '2026-03-10',
              },
              state: 'closed',
            });

      - name: 06 Handle Valid Request
        if: steps.codecheck.outputs.valid == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'processing',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'pending',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validated'],
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

      - name: 07 Update Issue State
        if: steps.codecheck.outputs.valid == 'true' && steps.meta.outputs.has_validated_label != 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.COURSE_AUTOMATION_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;

            const admins = await github.paginate(github.rest.orgs.listMembers, {
              org: owner,
              role: 'admin',
              per_page: 100,
            });

            const ownerLogins = [...new Set(
              admins
                .map((member) => (member && member.login ? member.login.trim() : ''))
                .filter(Boolean)
            )];

            const mentions = ownerLogins.map((login) => `@${login}`);

            const toSentence = (values) => {
              if (values.length === 0) return '';
              if (values.length === 1) return values[0];
              if (values.length === 2) return `${values[0]} and ${values[1]}`;
              return `${values.slice(0, -1).join(', ')}, and ${values[values.length - 1]}`;
            };

            const notifyText = mentions.length > 0
              ? `${toSentence(mentions)} ${mentions.length === 1 ? 'is' : 'are'} notified.`
              : 'Instructors are notified.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Your submitted access code is valid. Your request is now waiting for instructor approval. You do not need to take any action right now. ${notifyText}`,
            });

      - name: 08 Publish Workflow Summary
        uses: actions/github-script@v9
        with:
          script: |
            const valid = '${{ steps.codecheck.outputs.valid }}' === 'true';
            const alreadyValidated = '${{ steps.meta.outputs.has_validated_label }}' === 'true';

            if (!valid) {
              core.notice('Summary: invalid access request was marked failed and closed.');
              return;
            }

            if (alreadyValidated) {
              core.notice('Summary: valid access request already had validated label; no duplicate notify comment was added.');
              return;
            }

            core.notice('Summary: valid access request was marked validated and student/instructors were notified in issue comments.');